name: Ollama generated docs fix

on:
  push:
    branches: [tools/ollama-lock-fix]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ollama-docs-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/ollama-v3
          persist-credentials: true

      - name: Load shared version pins
        id: versions
        uses: ./.github/actions/load-version-pins

      - name: Install Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@f8e1b42fbd1e09df5263c26b7df6011eaafd454d
        with:
          version: '${{ steps.versions.outputs.weaver_version }}'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Regenerate all committed outputs
        run: |
          for attempt in 1 2 3; do
            if make generate-all > /tmp/gen.log 2>&1; then
              tail -n 40 /tmp/gen.log
              exit 0
            fi
            tail -n 80 /tmp/gen.log
            if grep -qiE "503|service unavailable|timed? ?out|failed to fetch" /tmp/gen.log; then
              echo "::notice::Transient network failure during generation, retry attempt $attempt/3"
              sleep 30
              continue
            fi
            exit 1
          done
          exit 1

      - name: Commit and push to feat/ollama-v3
        run: |
          git config user.name "kurosiniso"
          git config user.email "kurosi78@laposte.net"
          git add docs model AGENTS.md
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git diff --cached --stat
          git commit -s -m "chore: regenerate registry docs for ollama attributes" -m "The hand-reconstructed registry page docs/registry/attributes/ollama.md drifted from weaver output: it lacked rows for ollama.request.main_gpu, ollama.request.num_batch, ollama.request.num_ctx, ollama.request.num_gpu, ollama.response.load_duration and ollama.response.total_duration, and used trailing double spaces inside table rows. Regenerate with make generate-all so committed outputs are byte-exact."
          git push origin HEAD:feat/ollama-v3
