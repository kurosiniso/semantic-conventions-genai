name: Watch upstream PR 700

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: watch-upstream-pr-700
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTREAM_REPO: open-telemetry/semantic-conventions-genai
      UPSTREAM_PR: "700"
      FORK_PR: "1"
      LOOKBACK_HOURS: "24"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Detect and report new PR activity
        run: |
          set -euo pipefail

          api() {
            local path="$1" out
            if out=$(gh api "$path" 2>/dev/null); then
              printf '%s' "$out"
            else
              curl -fsSL "https://api.github.com/$path"
            fi
          }

          cutoff=$(date -u -d "$LOOKBACK_HOURS hours ago" '+%Y-%m-%dT%H:%M:%SZ')
          events=$(mktemp)
          reported=$(mktemp)
          bodyfile=$(mktemp)
          report=$(mktemp)

          # Pull request state changes
          pr=$(api "repos/$UPSTREAM_REPO/pulls/$UPSTREAM_PR")
          state=$(jq -r '.state' <<<"$pr")
          merged=$(jq -r '.merged' <<<"$pr")
          if [ "$merged" = "true" ]; then
            printf 'pr:merged\tThe pull request was MERGED.\n' >> "$events"
          elif [ "$state" = "closed" ]; then
            printf 'pr:closed\tThe pull request was CLOSED.\n' >> "$events"
          fi

          # New issue comments
          api "repos/$UPSTREAM_REPO/issues/$UPSTREAM_PR/comments?since=$cutoff&per_page=100" \
            | jq -r '.[] | select(.user.login != "kurosiniso") | "comment:" + (.id|tostring) + "\tNew issue comment by " + .user.login + " (" + .created_at + "): " + ((.body // "") | gsub("[\\r\\n\\t]+"; " ") | .[0:160])' >> "$events" || true

          # New reviews
          api "repos/$UPSTREAM_REPO/pulls/$UPSTREAM_PR/reviews?per_page=100" \
            | jq -r --arg cutoff "$cutoff" '.[] | select(.submitted_at != null and .submitted_at >= $cutoff and .user.login != "kurosiniso") | "review:" + (.id|tostring) + "\tNew review by " + .user.login + " (state: " + (.state // "unknown") + ")"' >> "$events" || true

          # New review comments
          api "repos/$UPSTREAM_REPO/pulls/$UPSTREAM_PR/comments?since=$cutoff&per_page=100" \
            | jq -r '.[] | select(.user.login != "kurosiniso") | "reviewcomment:" + (.id|tostring) + "\tNew review comment by " + .user.login + " on " + (.path // "?") + ": " + ((.body // "") | gsub("[\\r\\n\\t]+"; " ") | .[0:160])' >> "$events" || true

          # New commits pushed by others
          api "repos/$UPSTREAM_REPO/pulls/$UPSTREAM_PR/commits?per_page=100" \
            | jq -r --arg cutoff "$cutoff" '.[] | select(((.commit.committer.date // "") >= $cutoff) and ((.author.login // .commit.author.name) != "kurosiniso")) | "commit:" + .sha + "\tNew commit by " + (.author.login // .commit.author.name) + ": " + (.commit.message | split("\n")[0] | .[0:140])' >> "$events" || true

          # Previously reported ids live in this PR's comments
          gh pr view "$FORK_PR" --json comments --jq '.comments[].body' > "$reported" || true

          # Deduplicate against previously reported ids
          while IFS=$'\t' read -r id desc; do
            [ -z "$id" ] && continue
            if grep -qF "[id:$id]" "$reported"; then continue; fi
            printf -- '- [id:%s] %s\n' "$id" "$desc" >> "$report"
          done < "$events"

          if [ ! -s "$report" ]; then
            echo "No new activity on upstream PR #$UPSTREAM_PR since $cutoff (after dedup)."
            exit 0
          fi

          {
            echo "New activity detected on upstream PR #$UPSTREAM_PR:"
            echo ""
            cat "$report"
            echo ""
            echo "https://github.com/$UPSTREAM_REPO/pull/$UPSTREAM_PR"
          } > "$bodyfile"

          gh pr comment "$FORK_PR" --body-file "$bodyfile"
          echo "Posted update to fork PR #$FORK_PR."
